name: Docker App

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "prisma/**"
      - "scripts/**"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "prisma.config.ts"
      - "vitest*.mts"
      - "eslint.config.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - ".github/workflows/docker-app.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this revision to production after validation
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || inputs.deploy) && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' && !inputs.deploy }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    # Throwaway Postgres for the integration tests (tests/support/db-setup.ts wipes it each run).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet_twin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit & integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wallet_twin_test
        run: pnpm test

      - name: Test build
        env:
          NEXT_PUBLIC_SUI_NETWORK: mainnet
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          SESSION_SECRET: dummy-build-secret-at-least-32-chars-long
        run: pnpm build

      - name: Normalize image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,priority=1000,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUI_NETWORK=${{ vars.NEXT_PUBLIC_SUI_NETWORK || 'mainnet' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL || 'https://wallet-twin.gcp.nudgen.net' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max

      - name: Deploy App to CapRover with CLI
        if: github.event_name == 'push' || inputs.deploy
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_HOST }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          CAPROVER_IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          if [ -z "$CAPROVER_URL" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "CapRover deployment secrets not configured; skipping CapRover deployment."
            exit 0
          fi
          npm install --global caprover@2.3.1
          caprover deploy

      - name: Discord notification
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE: >-
            Built and deployed new image `wallet-twin` at
            `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-${{ github.sha }}`
            commit `${{ github.event.head_commit.message || github.sha }}`
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping Discord notification."
            exit 0
          fi

          jq -n --arg content "$DISCORD_MESSAGE" '{content: $content}' \
            | curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data @- \
              "$DISCORD_WEBHOOK"
